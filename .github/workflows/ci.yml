name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.6"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: uv sync --locked --python 3.11
      - name: Backend lint
        run: uv run --locked ruff check --no-cache src tests
      - name: Backend unit tests
        run: uv run --locked pytest -q -p no:cacheprovider tests/test_models.py tests/test_candidate_runner.py tests/test_mock_provider.py tests/test_database.py tests/test_workspace.py tests/test_staging.py tests/test_compose.py tests/test_docker_runner.py
      - name: Backend integration tests
        run: uv run --locked pytest -q -p no:cacheprovider tests/test_health.py tests/test_approval_api.py tests/test_events.py tests/test_pipeline.py tests/test_workflow_restart.py tests/test_publication_recovery.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.6"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend environment for E2E
        working-directory: backend
        run: uv sync --locked --python 3.11
      - run: npm ci
      - name: Frontend lint
        run: npm run lint
      - name: Frontend unit tests
        run: npm test
      - name: Frontend build
        run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Frontend E2E
        run: npm run test:e2e

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: production
          push: false
          tags: devflow-backend:ci
      - uses: docker/build-push-action@v6
        with:
          context: ./client
          file: ./client/Dockerfile
          target: production
          push: false
          tags: devflow-frontend:ci
      - name: Compose workflow smoke test
        shell: bash
        run: |
          set -euo pipefail
          cleanup() { docker compose down --volumes --remove-orphans; }
          trap cleanup EXIT
          docker compose up --build --detach
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/api/health >/dev/null; then break; fi
            sleep 2
          done
          response=$(curl --fail --silent --show-error \
            -H 'content-type: application/json' \
            -d '{"task":"CI Compose workflow proof"}' \
            http://127.0.0.1:8000/api/runs)
          python -c 'import json,sys; data=json.load(sys.stdin); assert data["status"] == "AWAITING_APPROVAL", data' <<<"$response"

